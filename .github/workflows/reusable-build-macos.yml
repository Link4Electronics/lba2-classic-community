name: Build macOS (reusable)

# Reusable build steps for the macOS target. Called by release-macos.yml
# (tag-triggered) and release-latest.yml (rolling pre-release). Produces a
# `dist/` directory with the DMG and uploads it as a workflow artifact
# named `<artifact-prefix>-<arch>`.
#
# See docs/RELEASING.md "Adding a new release target" for the recipe this
# file follows.

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: >-
          Prefix for the upload-artifact name. Caller appends -<arch>.
          Tag releases pass "macOS" (default); release-latest passes
          "latest-macos" so its download-artifact pattern picks them up.
        type: string
        required: false
        default: macOS

jobs:
  build:
    name: "Build ${{ matrix.arch }}"
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # arm64-only for now. The macos-13 (Intel) runners GitHub provides
        # are queueing 30+ minutes per job (Apple is winding them down) while
        # macos-latest finishes in ~30s. Apple Silicon is the present and
        # future of Mac; Intel-Mac users can still produce a local DMG via
        # scripts/dev/build-macos-release.sh --preset macos_x86_64. Add
        # x86_64 back here only if a hosted runner becomes reliable again,
        # or when we move to a universal2 (arm64+x86_64) binary built on a
        # single arm64 runner via lipo.
        include:
          - runs-on: macos-latest   # Apple Silicon (arm64)
            arch: arm64
            preset: macos_arm64
    steps:
      - name: Code Checkout
        uses: actions/checkout@v6
        with:
          # Full history so cmake/git_version.cmake can detect a clean
          # vs dirty tree (release tags are clean; -dirty is suppressed).
          fetch-depth: 0

      - name: Install SDL3 (static build)
        # link: static builds the static archive our LBA2_LINK_STATIC=ON path
        # needs; find_package then resolves SDL3::SDL3-static, which the root
        # CMakeLists.txt selects explicitly.
        uses: ./.github/actions/setup-sdl3
        id: sdl
        with:
          link: static
          build-type: Release

      # glslang compiles the shared GLSL to SPIR-V; spirv-cross cross-compiles
      # that to MSL, the format SDL's Metal backend loads. Neither is on the
      # runner image, and without them the configure fails outright: Apple has
      # no SPIR-V fallback, Metal is the only driver.
      - name: Install shader toolchain
        run: brew install glslang spirv-cross

      - name: Configure (static-link release build)
        run: |
          cmake --preset ${{ matrix.preset }} \
                -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}" \
                -DLBA2_LINK_STATIC=ON \
                -DLBA2_RELEASE_SYMBOLS=ON \
                -DCMAKE_BUILD_TYPE=Release

      # Configure fails without the tools above, so this is belt-and-braces:
      # it catches the case where they exist but produced nothing usable, and
      # says in one line what the shipped binary can render.
      - name: Verify shaders are embedded (SPIR-V + MSL)
        run: |
          HDR="out/build/${{ matrix.preset }}/LIB386/SDL3GPU/sdl3gpu_shader_formats.h"
          if ! grep -q "SDL3GPU_SHADERFORMAT_SPIRV_AVAILABLE 1" "$HDR" || \
             ! grep -q "SDL3GPU_SHADERFORMAT_MSL_AVAILABLE 1" "$HDR"; then
            echo "expected SPIRV_AVAILABLE 1 and MSL_AVAILABLE 1 in $HDR:" >&2
            cat "$HDR" >&2
            exit 1
          fi

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Bundle DMG
        run: |
          BUILD_DIR=out/build/${{ matrix.preset }}
          VERSION=$(cat "$BUILD_DIR/VERSION.txt")
          mkdir -p dist
          bash scripts/packaging/bundle-macos.sh \
            --app "$BUILD_DIR/SOURCES/LBA2 Classic Community.app" \
            --version "$VERSION" \
            --arch ${{ matrix.arch }} \
            --build-dir "$BUILD_DIR" \
            --output-dir dist \
            --split-symbols

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.arch }}
          path: |
            dist
            !dist/*-symbols.tar.xz

      # Its own artifact, so it outlives the rolling release, which replaces its
      # assets on every push: scripts/dev/symbolize_crash.py --fetch finds it by the
      # commit in a crash block. A tag release also attaches it to the release.
      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.arch }}-symbols
          path: dist/*-symbols.tar.xz
          if-no-files-found: error
          retention-days: 90
