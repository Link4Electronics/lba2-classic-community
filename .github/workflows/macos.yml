name: macOS

# See linux.yml for paths-ignore rationale.
on:
  push:
    paths-ignore: &doc-paths
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.vscode/**'
      - '.editorconfig'
      - '.git-blame-ignore-revs'
      - 'cliff.toml'
  pull_request:
    paths-ignore: *doc-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Code Checkout
        uses: actions/checkout@v5

      - name: Install SDL3
        uses: ./.github/actions/setup-sdl3
        id: sdl
        with:
          build-type: ${{ env.BUILD_TYPE }}

      # glslang compiles the shared GLSL to SPIR-V; spirv-cross cross-compiles
      # that to MSL, the format SDL's Metal backend loads. Neither is on the
      # runner image, and without them the configure fails outright: Apple has
      # no SPIR-V fallback, Metal is the only driver.
      - name: Install shader toolchain
        run: brew install glslang spirv-cross

      # See linux.yml: the macos-latest runner image already ships CMake and
      # Ninja well past the 3.23 floor, so there is no toolchain fetch here.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}" \
            -DLBA2_BUILD_TESTS=ON \
            -DLBA2_BUILD_ASM_EQUIV_TESTS=OFF \
            --preset macos_arm64

      # Configure fails without the tools above, so this is belt-and-braces:
      # it catches the case where they exist but produced nothing usable, and
      # says in one line what the binary can render.
      - name: Verify shaders are embedded (SPIR-V + MSL)
        run: |
          HDR="build/LIB386/SDL3GPU/sdl3gpu_shader_formats.h"
          if ! grep -q "SDL3GPU_SHADERFORMAT_SPIRV_AVAILABLE 1" "$HDR" || \
             ! grep -q "SDL3GPU_SHADERFORMAT_MSL_AVAILABLE 1" "$HDR"; then
            echo "expected SPIRV_AVAILABLE 1 and MSL_AVAILABLE 1 in $HDR:" >&2
            cat "$HDR" >&2
            exit 1
          fi

      - name: Build
        run: |
          cmake --build build --target lba2cc
          cmake --build build --target host_tests

      - name: Host tests
        run: cd build && ctest -L host_quick --output-on-failure

      # tests/numeric_contract measures rather than asserts where long double is
      # not 80-bit, which is every Apple target. That measurement is the reason
      # it runs here at all: it says how far this host's projection, rotation and
      # distance rounding sits from the x86-64 numbers a recording is replayed
      # against, and nobody needs a Mac to read it.
      #
      # A second, verbose run because `--output-on-failure` shows nothing for a
      # test that passes, and this one passes on purpose. Costs a hundredth of a
      # second and is the only place the ARM figures appear.
      - name: Report the ARM numeric measurement
        run: cd build && ctest -R test_numeric_contract -V

      - name: Verify Binary
        # CMake's MACOSX_BUNDLE wiring (in SOURCES/CMakeLists.txt) puts the
        # binary inside an .app bundle. The bundle dir is named after
        # LBA2_PRODUCT_NAME (Finder display name); the inner Mach-O keeps
        # the terse LBA2_EXECUTABLE_NAME. The bare build/SOURCES/lba2cc
        # path only exists for non-Apple builds.
        run: |
          test -d "build/SOURCES/LBA2 Classic Community.app"
          test -x "build/SOURCES/LBA2 Classic Community.app/Contents/MacOS/lba2cc"
          echo "Build successful"
